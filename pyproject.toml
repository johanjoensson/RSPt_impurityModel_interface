[project]
name = "impurityModel_interface"
description = "Interface for running impurityModel from RSPt"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
"cffi",
"numpy",
"scipy",
"h5py",
"mpi4py",
"impurityModel @ git+https://github.com/johanjoensson/impurityModel.git",
"rspt2spectra @ git+https://github.com/johanjoensson/rspt2spectra.git"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/johanjoensson/impurityModel_interface/"
Issues = "https://github.com/johanjoensson/impurityModel_interface//issues"


[build-system]
requires = ["setuptools >= 77.0.3", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
# Pin the target so Black's output is deterministic regardless of the running
# interpreter. Without this, Black auto-detects a newer Python and warns that the
# CI interpreter "cannot parse code formatted for Python 3.x". CI runs 3.11.
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test the source tree, never a stale copy installed in site-packages.
pythonpath = ["src"]

[tool.ruff]
line-length = 120

lint.select = ["E", "F", "B", "C4", "PL", "A", "SIM", "RUF", "PGH", "I"]

lint.ignore = ["B905", "PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "SIM105","RUF005", "PGH003", "C408", "SIM118", "E741", "PLR5501"]
